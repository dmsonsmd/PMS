<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Inspection & Sign-Off</title>
    <style>
        :root { --primary: #2d3748; --primary-light: #edf2f7; --bg: #f4f6f8; --card-bg: #ffffff; --border: #e2e8f0; --text-dark: #1a202c; --text-muted: #4a5568; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { background-color: var(--bg); margin: 0; padding: 24px; color: var(--text-dark); }
        .container { max-width: 1300px; margin: auto; }
        
        .header-box { background: var(--card-bg); padding: 18px 24px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); display: flex; justify-content: space-between; align-items: center; }
        .header-box h2 { margin: 0; font-size: 20px; font-weight: 700; color: var(--text-dark); }
        
        .controls-right { display: flex; align-items: center; gap: 16px; }
        .user-tag-box { display: flex; align-items: center; gap: 6px; background: #edf2f7; padding: 6px 12px; border-radius: 20px; border: 1px solid #cbd5e0; }
        .user-tag-box label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .user-tag-box input { border: none; background: transparent; font-size: 13.5px; font-weight: 700; color: var(--primary); width: 140px; outline: none; }
        
        .tab-group { display: flex; gap: 8px; background: #f1f5f9; padding: 4px; border-radius: 28px; }
        .tab-btn { border: none; background: transparent; padding: 8px 16px; border-radius: 24px; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
        .tab-btn.active { background: #ffffff; color: var(--primary); box-shadow: 0 1px 4px rgba(0,0,0,0.08); font-weight: 700; }

        .table-card { background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 24px; }
        table.master-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        table.master-table th { background: #f8fafc; color: var(--text-muted); padding: 12px 14px; border-bottom: 2px solid var(--border); text-transform: uppercase; font-size: 11.5px; }
        table.master-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
        table.master-table tr:hover td { background-color: #f1f5f9; }
        table.master-table tr.selected td { background-color: var(--primary-light); font-weight: 600; }

        .review-card { background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border); padding: 24px; display: none; }
        .section-title { font-size: 16px; font-weight: 700; margin-bottom: 20px; border-bottom: 1px solid #edf2f7; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

        .link-btn { display: inline-flex; align-items: center; gap: 6px; color: #2b6cb0; font-weight: 600; font-size: 13px; text-decoration: none; padding: 8px 12px; background: #ebf8ff; border-radius: 6px; margin-right: 8px; margin-bottom: 8px;}
        .link-btn:hover { text-decoration: underline; }
        .no-doc { color: #a0aec0; font-size: 13px; }

        .item-details-box { background: #ffffff; border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 20px; overflow-x: auto;}
        .box-title { font-size: 12.5px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        
        table.items-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
        table.items-table th { background: #f8fafc; color: #475569; padding: 12px 14px; border-bottom: 1px solid var(--border); text-align: left; font-size: 12px; font-weight: 700; white-space: nowrap;}
        table.items-table td { padding: 16px 14px; border-bottom: 1px solid #f1f5f9; color: var(--text-dark); vertical-align: middle;}
        
        .tag-heat { background: #f1f5f9; border: 1px solid #cbd5e0; padding: 6px 10px; border-radius: 6px; font-weight: 600; font-size: 12.5px; color: #4a5568; white-space: nowrap; display: inline-block;}
        .tag-plate { background: #ebf8ff; color: #2b6cb0; border: 1px solid #bee3f8; padding: 6px 10px; border-radius: 6px; font-weight: 600; font-size: 12.5px; white-space: nowrap; display: inline-block;}
        
        input[type="checkbox"] { cursor: pointer; transform: scale(1.2); }

        .upload-box { background: #f8fafc; border: 2px dashed #cbd5e0; padding: 24px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        
        .btn-container { display: flex; gap: 14px; margin-top: 15px; }
        .btn-action { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 14.5px; font-weight: 700; cursor: pointer; color: #fff; background-color: #3182ce; transition: opacity 0.2s;}
        .btn-action:hover { opacity: 0.9; }
        .btn-print { background-color: #4a5568; }
        .btn-whatsapp { background-color: #25D366; display: none; }
        
        #statusMsg { text-align: center; font-size: 14px; font-weight: 700; margin-top: 14px; display: none; }
        .empty-hint { text-align: center; color: var(--text-muted); padding: 30px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <h2>Final Inspection & Sign-Off</h2>
        <div class="controls-right">
            <div class="user-tag-box">
                <label>Inspector Name:</label>
                <input type="text" id="formFilledBy" placeholder="Your Name" autocomplete="name">
            </div>
            <div class="tab-group">
                <button class="tab-btn active" id="tabPending" onclick="switchTab('pending')">Pending Sign-off (<span id="pendingCount">0</span>)</button>
                <button class="tab-btn" id="tabCompleted" onclick="switchTab('completed')">Completed (<span id="completedCount">0</span>)</button>
            </div>
        </div>
    </div>

    <div class="table-card">
        <table class="master-table">
            <thead>
                <tr>
                    <th>PO Number</th>
                    <th>Client Name</th>
                    <th>PO Date</th>
                    <th>Items Ready</th>
                </tr>
            </thead>
            <tbody id="ordersTableBody">
                <tr><td colspan="4" class="empty-hint">Loading data...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="review-card" id="processingForm">
        <div class="section-title">
            <span id="dispTitle">Order Details</span>
            <button class="btn-action btn-print" id="btnPrint" onclick="generatePrintableReport()" style="flex: none; padding: 8px 16px; font-size: 13px;">🖨️ Print Inspection Report</button>
        </div>

        <div id="godownLinksContainer" style="margin-bottom: 20px;"><span class="no-doc">Loading documents...</span></div>

        <!-- Dynamic Container for Items Table -->
        <div id="itemsContainer"></div>

        <div id="uploadSection" class="upload-box">
            <label style="font-weight: 700; color: #2d3748; display: block; margin-bottom: 10px; font-size: 15px;">Upload Signed Inspection Report</label>
            <input type="file" id="formUpload" accept="image/*, application/pdf">
        </div>

        <div id="completedLinks" style="display:none; margin-bottom: 20px;"></div>

        <div class="btn-container">
            <button class="btn-action" id="btnSave" onclick="saveToSheet()">Save Signed Report</button>
            <button class="btn-action btn-whatsapp" id="btnWhatsApp" onclick="shareWhatsApp()">WhatsApp Share</button>
        </div>
        <div id="statusMsg"></div>
    </div>
</div>

<script>
    // ⚠️ PASTE YOUR ACTIVE REPORT APPS SCRIPT DEPLOYMENT URL HERE
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzyt5j_K8ZzLfgOUdXrTckSMRBH8HUhxhlFEQix00_iNUHhoHsSMk2aq302C4M9hSq7/exec";

    let pendingOrders = [];
    let completedOrders = [];
    let currentTab = "pending";
    let selectedOrder = null;

    window.addEventListener('DOMContentLoaded', () => {
        const savedName = localStorage.getItem("report_filled_by");
        if (savedName) document.getElementById('formFilledBy').value = savedName;
        loadData();
    });

    document.getElementById('formFilledBy').addEventListener('input', (e) => {
        localStorage.setItem("report_filled_by", e.target.value.trim());
    });

    function loadData() {
        fetch(WEB_APP_URL)
            .then(res => res.json())
            .then(data => {
                pendingOrders = data.pending || [];
                completedOrders = data.completed || [];
                document.getElementById('pendingCount').textContent = pendingOrders.length;
                document.getElementById('completedCount').textContent = completedOrders.length;
                renderTable();
            }).catch(err => {
                document.getElementById('ordersTableBody').innerHTML = `<tr><td colspan="4" style="color:red; text-align:center;">Failed to load data.</td></tr>`;
            });
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabPending').classList.toggle('active', tab === 'pending');
        document.getElementById('tabCompleted').classList.toggle('active', tab === 'completed');
        
        selectedOrder = null;
        document.getElementById('processingForm').style.display = 'none';
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('ordersTableBody');
        const list = currentTab === 'pending' ? pendingOrders : completedOrders;

        if (list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="empty-hint">No ${currentTab} orders found.</td></tr>`;
            return;
        }

        tbody.innerHTML = '';
        list.forEach((order, index) => {
            const tr = document.createElement('tr');
            if (currentTab === 'pending') {
                tr.innerHTML = `
                    <td><b>${order.poNumber}</b></td>
                    <td>${order.client}</td>
                    <td>${order.poDate}</td>
                    <td><span style="color: #c53030; font-weight:700;">${order.itemList.length} Remaining</span></td>
                `;
            } else {
                tr.innerHTML = `
                    <td><b>${order.poNumber}</b></td>
                    <td>${order.client}</td>
                    <td>${order.poDate}</td>
                    <td><span style="color: #38a169; font-weight:700;">${order.itemList.length} Items Signed</span></td>
                `;
            }
            tr.onclick = () => selectRow(index, tr);
            tbody.appendChild(tr);
        });
    }

    function toggleAllCheckboxes(source) {
        const checkboxes = document.querySelectorAll('.item-checkbox');
        for(let i = 0; i < checkboxes.length; i++) {
            checkboxes[i].checked = source.checked;
        }
    }

    function selectRow(index, rowEl) {
        document.querySelectorAll('#ordersTableBody tr').forEach(r => r.classList.remove('selected'));
        rowEl.classList.add('selected');
        document.getElementById('processingForm').style.display = 'block';

        const list = currentTab === 'pending' ? pendingOrders : completedOrders;
        selectedOrder = list[index];

        const linksContainer = document.getElementById('godownLinksContainer');
        linksContainer.innerHTML = '';
        
        if (selectedOrder.poDocLink && selectedOrder.poDocLink.startsWith("http")) {
            linksContainer.innerHTML = `<a href="${selectedOrder.poDocLink}" target="_blank" class="link-btn">📄 Attached PO / Ref Doc</a>`;
        } else {
            linksContainer.innerHTML = `<span class="no-doc">No PO Document attached</span>`;
        }

        const container = document.getElementById('itemsContainer');

        if (currentTab === 'pending') {
            document.getElementById('dispTitle').textContent = `Order: ${selectedOrder.poNumber} - ${selectedOrder.client}`;
            document.getElementById('uploadSection').style.display = 'block';
            document.getElementById('btnSave').style.display = 'block';
            document.getElementById('btnPrint').style.display = 'block';
            document.getElementById('btnWhatsApp').style.display = 'none';
            document.getElementById('completedLinks').style.display = 'none';
            
            let tableHtml = `
                <div class="item-details-box">
                    <div class="box-title">
                        <span>SELECT ITEMS TO INCLUDE IN REPORT</span>
                        <span style="color: #3182ce;">${selectedOrder.itemList.length} ITEMS REMAINING</span>
                    </div>
                    <div style="overflow-x: auto;">
                    <table class="items-table">
                        <thead>
                            <tr>
                                <th style="width: 40px;"><input type="checkbox" id="selectAllCheckbox" checked onchange="toggleAllCheckboxes(this)"></th>
                                <th>Grade</th>
                                <th>Make</th>
                                <th>Size</th>
                                <th>Qty</th>
                                <th>Heat Number</th>
                                <th>Plate Number</th>
                                <th>TC Number</th>
                                <th>TC Document</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            selectedOrder.itemList.forEach((it, i) => {
                let tcDocLink = it.tcFile && it.tcFile.startsWith("http") ? `<a href="${it.tcFile}" target="_blank" style="color:#3182ce; font-weight:600; text-decoration:underline;">View Document</a>` : "<span style='color:#a0aec0;'>-</span>";
                
                tableHtml += `
                    <tr>
                        <td><input type="checkbox" class="item-checkbox" value="${i}" checked></td>
                        <td style="font-weight: 600;">${it.grade || "-"}</td>
                        <td style="font-weight: 600; color: #4a5568;">${it.make || "-"}</td>
                        <td>${it.size || "-"}</td>
                        <td>${it.qty || "-"}</td>
                        <td><span class="tag-heat">${it.heat || "-"}</span></td>
                        <td><span class="tag-plate">${it.plate || "-"}</span></td>
                        <td><b style="color: #2b6cb0;">${it.tcNumber || "-"}</b></td>
                        <td>${tcDocLink}</td>
                    </tr>
                `;
            });
            tableHtml += `</tbody></table></div></div>`;
            container.innerHTML = tableHtml;

        } else {
            // UI adjustments for Completed Tab
            document.getElementById('dispTitle').textContent = `Completed Report: ${selectedOrder.poNumber} - ${selectedOrder.client}`;
            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('btnSave').style.display = 'none';
            document.getElementById('btnPrint').style.display = 'none';
            document.getElementById('btnWhatsApp').style.display = 'block';
            
            let tableHtml = `
                <div class="item-details-box">
                    <div class="box-title">
                        <span>SIGNED ITEMS (COMPLETED REPORT)</span>
                        <span style="color: #38a169;">${selectedOrder.itemList.length} ITEMS LOGGED</span>
                    </div>
                    <div style="overflow-x: auto;">
                    <table class="items-table">
                        <thead>
                            <tr>
                                <th style="width: 40px;">#</th>
                                <th>Grade</th>
                                <th>Make</th>
                                <th>Size</th>
                                <th>Qty</th>
                                <th>Heat Number</th>
                                <th>Plate Number</th>
                                <th>TC Number</th>
                                <th>TC Document</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            selectedOrder.itemList.forEach((it, i) => {
                let tcDocLink = it.tcFile && it.tcFile.startsWith("http") ? `<a href="${it.tcFile}" target="_blank" style="color:#3182ce; font-weight:600; text-decoration:underline;">View Document</a>` : "<span style='color:#a0aec0;'>-</span>";

                tableHtml += `
                    <tr>
                        <td>${i + 1}</td>
                        <td style="font-weight: 600;">${it.grade || "-"}</td>
                        <td style="font-weight: 600; color: #4a5568;">${it.make || "-"}</td>
                        <td>${it.size || "-"}</td>
                        <td>${it.qty || "-"}</td>
                        <td><span class="tag-heat">${it.heat || "-"}</span></td>
                        <td><span class="tag-plate">${it.plate || "-"}</span></td>
                        <td><b style="color: #2b6cb0;">${it.tcNumber || "-"}</b></td>
                        <td>${tcDocLink}</td>
                    </tr>
                `;
            });
            tableHtml += `</tbody></table></div></div>`;
            container.innerHTML = tableHtml;
            
            const cLinks = document.getElementById('completedLinks');
            cLinks.style.display = 'block';
            cLinks.innerHTML = `<a href="${selectedOrder.signedFile}" target="_blank" style="display:inline-block; padding:8px 12px; background:#ebf8ff; color:#2b6cb0; font-weight:bold; text-decoration:none; border-radius:6px; border:1px solid #bee3f8;">📄 View Signed Report</a>`;
        }
    }

    function generatePrintableReport() {
        if (!selectedOrder) return;
        
        const selectedIndices = Array.from(document.querySelectorAll('.item-checkbox:checked')).map(cb => parseInt(cb.value));
        
        if (selectedIndices.length === 0) {
            return alert("Please select at least one item to include in the report.");
        }
        
        let currentDate = new Date().toLocaleDateString('en-GB');
        let itemsHTML = '';
        let displayIndex = 1;
        
        selectedIndices.forEach(i => {
            let it = selectedOrder.itemList[i];
            
            itemsHTML += `
                <tr>
                    <td>${displayIndex++}</td>
                    <td>${it.size || "-"}</td>
                    <td>${it.heat || "-"}</td>
                    <td>${it.plate || "-"}</td>
                    <td>${it.grade || "-"}</td>
                    <td>${it.make || "-"}</td>
                    <td>${it.tcNumber || "-"}</td>
                </tr>
            `;
        });

        const printWindow = window.open('', '_blank');
        printWindow.document.write(`
            <html>
            <head>
                <title>Inspection Report - ${selectedOrder.poNumber}</title>
                <style>
                    body { font-family: Arial, sans-serif; font-size: 12px; margin: 40px; color: #000; }
                    .header { text-align: center; margin-bottom: 20px; }
                    .header h2 { margin: 0; font-size: 18px; text-decoration: underline; }
                    .header h3 { margin: 5px 0; font-size: 14px; text-decoration: underline; }
                    
                    .meta-table { width: 100%; border: none; margin-bottom: 15px; font-size: 13px; }
                    .meta-table td { padding: 4px; }
                    
                    .data-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 12px; text-align: center;}
                    .data-table th, .data-table td { border: 1px solid #000; padding: 6px; }
                    .data-table th { font-weight: bold; background-color: #f2f2f2; }
                    
                    .notes-box { border: 1px solid #000; padding: 10px; margin-bottom: 20px; font-size: 12px; }
                    .notes-box h4 { margin: 0 0 5px 0; font-size: 12px; text-decoration: underline;}
                    
                    .footer-grid { display: flex; justify-content: space-between; border: 1px solid #000; }
                    .footer-box { padding: 10px; width: 33%; border-right: 1px solid #000; }
                    .footer-box:last-child { border-right: none; text-align: center; }
                    .sign-space { height: 60px; }
                </style>
            </head>
            <body>
                <div class="header">
                    <h2>DM SONS METAL PVT LTD, SURVEY NO-99, VAVANJE VILLAGE, TALOJA</h2>
                    <h3>OFFER LIST/ INSPECTION REPORT</h3>
                </div>

                <table class="meta-table">
                    <tr>
                        <td width="60%"><b>Client Name:</b> ${selectedOrder.client}</td>
                        <td width="40%"><b>Inspection Date:</b> ${currentDate}</td>
                    </tr>
                    <tr>
                        <td><b>PO No:</b> ${selectedOrder.poNumber}</td>
			            <td><b>PO Date:</b> ${selectedOrder.poDate}</td>
                    </tr>
                  </table>

                <table class="data-table">
                    <thead>
                        <tr>
                            <th width="5%">Sr. no</th>
                            <th width="25%">Description of Material (Size)</th>
                            <th width="14%">Heat No.</th>
                            <th width="14%">Plate No.</th>
                            <th width="18%">GRADE</th>
                            <th width="10%">Make</th>
                            <th width="14%">TC No.</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${itemsHTML}
                    </tbody>
                </table>

                <div class="notes-box">
                    <h4>NOTES:</h4>
                    <p style="margin: 3px 0;">1. Overall dimensions verified as noted above, Thickness verified by 'D' Meter/Vernier and found Satisfactory.</p>
                    <p style="margin: 3px 0;">2. Identification Marking/Stenciling correlated with MTC.</p>
                    <p style="margin: 3px 0;">3. Overall surface finish visually checked and found no surface damage, no atmospheric rust no pitting-satisfactory.</p>
                    <p style="margin-top: 15px;"><b>REMARKS IF ANY - </b> __________________________________________________________________</p>
                </div>

                <div class="footer-grid">
                    <div class="footer-box">
                        <b>Inspected By:</b><br><br>
                        Name: ${document.getElementById('formFilledBy').value || '_________________'}<br><br>
                        contact No: ________________
                    </div>
                    <div class="footer-box">
                        <div class="sign-space"></div>
                        Signature with Stamp
                    </div>
                </div>
            </body>
            </html>
        `);
        printWindow.document.close();
        setTimeout(() => { printWindow.print(); }, 500);
    }

    async function saveToSheet() {
        if (!selectedOrder) return;
        const filledBy = document.getElementById('formFilledBy').value.trim();
        const fileInput = document.getElementById('formUpload');
        
        const selectedIndices = Array.from(document.querySelectorAll('.item-checkbox:checked')).map(cb => parseInt(cb.value));
        if (selectedIndices.length === 0) return alert("Please select at least one item to save in this report.");
        
        if (!filledBy) return alert("Please enter the Inspector Name.");
        if (fileInput.files.length === 0) return alert("Please upload the signed document.");

        const statusMsg = document.getElementById('statusMsg');
        const btnSave = document.getElementById('btnSave');

        statusMsg.style.display = "block"; statusMsg.style.color = "#2b6cb0";
        statusMsg.textContent = "Uploading Signed Document... Please wait.";
        btnSave.disabled = true;

        try {
            const file = fileInput.files[0];
            const reader = new FileReader();
            
            const itemsToSave = selectedIndices.map(i => selectedOrder.itemList[i]);
            
            reader.onload = async function() {
                const base64Data = reader.result.split(',')[1];
                const fileData = { name: file.name, type: file.type, base64: base64Data };

                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ 
                        orderRecord: { poNumber: selectedOrder.poNumber, client: selectedOrder.client, poDate: selectedOrder.poDate }, 
                        selectedItems: itemsToSave,
                        fileData: fileData, 
                        filledBy: filledBy 
                    })
                });

                statusMsg.style.color = "#38a169"; statusMsg.textContent = "Saved Successfully!";
                setTimeout(() => { location.reload(); }, 1500);
            };
            reader.readAsDataURL(file);

        } catch (error) {
            statusMsg.style.color = "#e53e3e"; statusMsg.textContent = error.message;
            btnSave.disabled = false;
        }
    }

    function shareWhatsApp() {
        if (!selectedOrder) return;
        let msg = `*✅ Physical Inspection & Sign-off Completed*\n_${selectedOrder.timestamp}_\n\n`;
        msg += `*Client Name:* ${selectedOrder.client}\n`;
        msg += `*PO Number:* ${selectedOrder.poNumber}\n`;
        if (selectedOrder.poDocLink && selectedOrder.poDocLink.startsWith("http")) {
            msg += `*📄 PO Document:* ${selectedOrder.poDocLink}\n`;
        }
        msg += `*Inspector Name:* ${selectedOrder.filledBy}\n\n`;
        
        msg += `*📦 Items Signed Off (${selectedOrder.itemList.length}):*\n`;
        selectedOrder.itemList.forEach(it => {
            msg += `• Heat: ${it.heat || '-'} | Plate: ${it.plate || '-'} | TC: ${it.tcNumber || '-'}\n`;
        });
        
        if (selectedOrder.signedFile && selectedOrder.signedFile.startsWith("http")) {
            msg += `\n*📄 Signed Inspection Report:*\n${selectedOrder.signedFile}\n`;
        }
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }
</script>
</body>
</html>
